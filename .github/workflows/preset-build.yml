name: 全能影库 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Setup Python 3.8 (Chaquopy buildPython)
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"
      - name: Build Debug APK
        shell: bash
        run: |
          PY38=$(which python3.8)
          echo "buildPython=$PY38" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --warning-mode none
      - name: Upload APK (Release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="preset-${{ github.run_number }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --prerelease --title "Preset Build ${{ github.run_number }}" --notes "Preset TVBox, commit ${{ github.sha }}" $(find . -name "*.apk" -path "*outputs*")
