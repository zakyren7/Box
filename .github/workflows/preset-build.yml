name: 鍏ㄨ兘褰卞簱 Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 11
      - name: Build Debug APK
        shell: bash
        run: |
          touch local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --parallel --warning-mode none
      - name: Upload APK (Release)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="preset-${{ github.run_number }}"
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" --prerelease --title "鍏ㄨ兘褰卞簱 Build ${{ github.run_number }}" --notes "Preset TVBox, commit ${{ github.sha }}" $(find . -name "*.apk" -path "*outputs*")
